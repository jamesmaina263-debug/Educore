name: mpesa-stale-pending-cron

# Watchdog for M-Pesa STK requests whose callback never got processed (request still 'pending'
# >10 min after dispatch). Added after the 2026-10-03 incident where every genuine Daraja
# callback was silently rejected and rows sat on "Awaiting response" with no alert. The route is
# read-only apart from raising an alert (see src/app/api/cron/mpesa-stale-pending/route.ts).
#
# Reuses the EXTERNAL_CRON_SECRET repo secret + Vercel env var already used by
# announcements-cron.yml. Calls the "www" host directly (bare host 308-redirects).

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/mpesa-stale-pending
        run: |
          status=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.EXTERNAL_CRON_SECRET }}" \
            "https://www.educoreafrica.com/api/cron/mpesa-stale-pending")
          echo "HTTP status: $status"
          cat /tmp/response.json
          if [ "$status" -ge 300 ]; then
            echo "::error::mpesa-stale-pending cron call failed with status $status"
            exit 1
          fi

      - name: Notify Slack on failure
        if: failure()
        env:
          WEBHOOK_URL: ${{ secrets.SECURITY_ALERT_WEBHOOK_URL }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "SECURITY_ALERT_WEBHOOK_URL not set -- skipping Slack notification."
            exit 0
          fi
          python3 -c "import json, os; text = ':rotating_light: *M-Pesa stale-pending cron call failed*.\n• *run*: ' + os.environ['RUN_URL']; json.dump({'text': text}, open('/tmp/slack_payload.json', 'w'))"
          curl -s -X POST -H "Content-Type: application/json" -d @/tmp/slack_payload.json "$WEBHOOK_URL" > /dev/null || true
