name: Deploy edge functions

# Closes a gap found 2026-08-28: deploy-migrations.yml makes "merged to main" and "applied to
# the database" the same event, but nothing did the equivalent for edge functions -- a merged
# function change sat in the repo looking done without actually being live until someone
# manually ran `supabase functions deploy`. This is that missing piece.
#
# Needs a SUPABASE_ACCESS_TOKEN repo secret (Supabase dashboard -> Account -> Access Tokens --
# this is a personal access token scoped to your whole Supabase account, not a per-project
# credential like SUPABASE_DB_URL, so treat it accordingly). Unlike deploy-migrations.yml, this
# doesn't touch the database directly -- `supabase functions deploy` talks to Supabase's
# management API over normal HTTPS, so it isn't affected by the IPv6/pooler issue that blocked
# deploy-migrations.yml.
#
# Per-function verify_jwt settings come from supabase/config.toml, checked into this repo --
# see that file for why. Deploys every function it finds as a local directory under
# supabase/functions/; a function only present in Supabase (deployed out-of-band, bypassing git)
# is untouched either way.
#
# Gap closed 2026-09-02: this workflow and deploy-migrations.yml both trigger on push to
# main independently, with no ordering between them. On 2026-09-02, deploy-migrations.yml
# failed (a migration had been applied directly to prod without a matching git file, so
# `db push` refused to run anything behind it) while this workflow succeeded anyway and
# shipped a function that depended on the column the failed migration would have added --
# every STK push then failed for ~75 minutes. Fix: this workflow now runs `supabase db
# push` itself (same idempotent command as deploy-migrations.yml -- a no-op if already in
# sync) before deploying functions, and refuses to deploy if it fails. That makes "schema
# is up to date" a precondition of this job instead of an assumption about the other one.

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
  workflow_dispatch:

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          # Pinned per Supabase's own supply-chain guidance (avoid floating tags for CI
          # tooling, same principle as pinning application dependencies) -- version: latest
          # also has a documented history of breaking builds outright when the "latest
          # release" lookup and the actual published assets fall out of sync
          # (supabase/setup-cli#5257). Bump deliberately, as a reviewed diff, not silently.
          version: "2.116.0"

      - name: Verify database schema is in sync before deploying functions
        run: |
          set +e
          OUTPUT=$(supabase db push --db-url "${{ secrets.SUPABASE_DB_URL }}" --include-all 2>&1)
          STATUS=$?
          echo "$OUTPUT"
          if [ $STATUS -ne 0 ]; then
            SAFE=$(echo "$OUTPUT" | sed -E 's#(postgres(ql)?://[^:]+):[^@]*@#\1:REDACTED@#g' | tr '\n' ' ' | tail -c 900)
            echo "::error::Database is not in sync (db push failed) -- refusing to deploy functions against a schema they don't match. Fix migrations first: $SAFE"
            exit 1
          fi

      - name: Deploy functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set +e
          OUTPUT=$(supabase functions deploy --project-ref alzqlvfaftwegptfbfej 2>&1)
          STATUS=$?
          echo "$OUTPUT"
          if [ $STATUS -ne 0 ]; then
            SAFE=$(echo "$OUTPUT" | tr '\n' ' ' | tail -c 900)
            echo "::error::functions deploy failed: $SAFE"
            exit 1
          fi
