name: c2b-resolve-deferred-cron

# Resolves paybill (C2B) events parked as 'deferred_to_stk' when the STK path did not record the
# payment itself. A no-op until a school has feature.finance.c2b_capture on AND mode live (see
# src/app/api/cron/c2b-resolve-deferred/route.ts). Reuses the EXTERNAL_CRON_SECRET repo secret +
# Vercel env var already used by mpesa-stale-pending-cron.yml. Calls the "www" host directly.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/c2b-resolve-deferred
        run: |
          status=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.EXTERNAL_CRON_SECRET }}" \
            "https://www.educoreafrica.com/api/cron/c2b-resolve-deferred")
          echo "HTTP status: $status"
          cat /tmp/response.json
          if [ "$status" -ge 300 ]; then
            echo "::error::c2b-resolve-deferred cron call failed with status $status"
            exit 1
          fi

      - name: Notify Slack on failure
        if: failure()
        env:
          WEBHOOK_URL: ${{ secrets.SECURITY_ALERT_WEBHOOK_URL }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "SECURITY_ALERT_WEBHOOK_URL not set -- skipping Slack notification."
            exit 0
          fi
          python3 -c "import json, os; text = ':rotating_light: *C2B deferred-event resolver cron call failed*.\n• *run*: ' + os.environ['RUN_URL']; json.dump({'text': text}, open('/tmp/slack_payload.json', 'w'))"
          curl -s -X POST -H "Content-Type: application/json" -d @/tmp/slack_payload.json "$WEBHOOK_URL" > /dev/null || true
