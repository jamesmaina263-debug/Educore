name: Restore drill

# On-demand only, deliberately -- a restore drill spins up a real Postgres 17 instance and
# restores real student/finance data into it inside the CI runner. That's a fine thing to do
# occasionally and on purpose, not something that should run unattended on a schedule without
# someone watching the result. See docs/RESTORE_DRILL_RUNBOOK.md for the manual version of this
# same procedure and why it exists -- this workflow is that runbook automated so it doesn't need
# a spare 30-45 minutes and a local machine with the right Postgres client version installed.
on:
  workflow_dispatch: {}

# The first live run (workflow run 34190696555) failed with no readable error, and the fix for
# that -- posting the result as a commit comment -- itself failed on the very next run with no
# GITHUB_TOKEN permission granted for it. Declaring this explicitly rather than relying on
# whatever the repo/org default happens to be, same reasoning migration-drift-check.yml already
# uses for its own PR-comment step.
permissions:
  contents: write

jobs:
  restore-drill:
    runs-on: ubuntu-latest
    # A real Postgres 17 server to restore into, right in the runner -- no Supabase project
    # created and torn down, no local Docker needed on anyone's machine. Matches the Supabase
    # project's actual server version (confirmed via Supabase:get_project: postgres_engine "17"),
    # same reasoning as nightly-backup.yml's client version pin below.
    services:
      target-db:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: drill
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Check SUPABASE_DB_URL is set
        run: |
          if [ -z "${{ secrets.SUPABASE_DB_URL }}" ]; then
            echo "SUPABASE_DB_URL repo secret is not set -- same secret nightly-backup.yml uses. Failing loudly instead of skipping silently."
            exit 1
          fi

      # Same version-pinning reasoning as nightly-backup.yml: the dump was made with pg_dump 17,
      # and pg_restore refuses to even read a dump's table of contents from a newer major version
      # than itself (confirmed directly while building this workflow: Ubuntu's default v16 client
      # fails immediately with "unsupported version (1.16) in file header" on this exact dump).
      - name: Install postgresql-client-17
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release ca-certificates
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      # Pulls whichever nightly-backup.yml run most recently succeeded, rather than requiring
      # someone to know a specific run ID -- this is meant to answer "is our current backup
      # process actually restorable", not "was this one specific dump restorable".
      - name: Download latest successful nightly backup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list --repo "${{ github.repository }}" --workflow "nightly-backup.yml" \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$RUN_ID" ]; then
            echo "No successful 'Nightly database backup' run found -- nothing to restore."
            exit 1
          fi
          echo "Using backup from nightly-backup.yml run $RUN_ID"
          mkdir -p backup
          gh run download "$RUN_ID" --repo "${{ github.repository }}" --dir backup

      - name: Restore into the throwaway target
        run: |
          DUMP_FILE=$(find backup -name 'educore-backup-*.dump' | head -1)
          if [ -z "$DUMP_FILE" ]; then
            echo "Could not find a .dump file in the downloaded artifact."
            find backup -type f
            exit 1
          fi
          echo "Restoring $DUMP_FILE ($(stat -c%s "$DUMP_FILE") bytes)"

          set +e
          /usr/lib/postgresql/17/bin/pg_restore --no-owner --no-privileges --clean --if-exists \
            -d "postgresql://postgres:drill@localhost:5433/postgres" \
            "$DUMP_FILE" > /tmp/restore_output.txt 2>&1
          RESTORE_EXIT=$?
          set -e
          cat /tmp/restore_output.txt

          {
            echo "**pg_restore exit code:** $RESTORE_EXIT"
            echo '```'
            cat /tmp/restore_output.txt
            echo '```'
          } >> /tmp/drill_report.md

          # A nonzero exit here does NOT by itself mean the drill failed -- pg_restore exits 1
          # whenever it ignores *any* error and keeps going, which it does by default (no
          # --exit-on-error). What actually matters is *which* errors: this dump was made
          # --no-owner --no-privileges from a real Supabase project, and a bare postgres:17 image
          # has none of Supabase's roles (authenticated/anon/service_role) or extensions
          # (pg_net, supabase_vault) -- so every RLS policy statement referencing `authenticated`
          # and every pg_net/vault-related statement is *expected* to fail here specifically
          # because this is a throwaway target, not because the dump is broken.
          #
          # First real run's blocklist approach (grep for "FATAL|...|no such file|...") got this
          # backwards: the extension-control-file message contains the literal text "No such file
          # or directory" and got misclassified as fatal even though it's exactly the expected
          # warning this comment describes. Allow-listing the specific known-safe error shapes
          # instead of blocklisting fatal-sounding text is more robust -- anything that doesn't
          # match one of these is what actually gets treated as a real failure.
          UNEXPECTED=$(grep "pg_restore: error:" /tmp/restore_output.txt \
            | grep -viE 'extension "(pg_net|supabase_vault)"|extension pg_net|extension supabase_vault|relation "vault\.secrets"|role "(authenticated|anon|service_role)" does not exist' \
            || true)

          if [ -n "$UNEXPECTED" ]; then
            echo ""
            echo "Found error(s) that do NOT match the known-safe pg_net/supabase_vault/authenticated-role pattern:"
            echo "$UNEXPECTED"
            echo ""
            echo "Treating as a real drill failure -- see docs/RESTORE_DRILL_RUNBOOK.md for how to tell these apart."
            exit 1
          fi

          echo ""
          echo "All errors in this restore match the known-safe pg_net/supabase_vault/authenticated-role pattern (expected on a bare, non-Supabase target). Nothing unexpected found -- proceeding to compare actual data row counts, which is the part that matters."

      # The check CI can't do on its own: pg_restore --list (used in nightly-backup.yml's own
      # verify step) only proves the dump *parses*. This proves it actually restores into a real
      # server and that the row counts in the restored copy are in the right ballpark versus
      # production as of right now -- not an exact match (production keeps changing after the
      # nightly dump's timestamp), but nowhere near zero and no table silently missing.
      - name: Compare row counts against production
        run: |
          QUERY="select 'students' as t, count(*) from students
            union all select 'invoices', count(*) from invoices
            union all select 'payments', count(*) from payments
            union all select 'student_attendance', count(*) from student_attendance
            union all select 'marks', count(*) from marks
            union all select 'school_users', count(*) from school_users
            order by 1;"

          echo "=== Production (live) ==="
          psql "${{ secrets.SUPABASE_DB_URL }}" -Atqc "$QUERY" | tee /tmp/prod_counts.txt

          echo ""
          echo "=== Restored copy (from last night's dump) ==="
          PGPASSWORD=drill /usr/lib/postgresql/17/bin/psql -h localhost -p 5433 -U postgres -d postgres \
            -Atqc "$QUERY" | tee /tmp/restored_counts.txt

          echo ""
          echo "=== Summary ==="
          {
            echo "| Table | Production | Restored copy |"
            echo "|---|---|---|"
            paste -d'|' <(cut -d'|' -f1,2 /tmp/prod_counts.txt) <(cut -d'|' -f2 /tmp/restored_counts.txt) \
              | awk -F'|' '{print "| " $1 " | " $2 " | " $3 " |"}'
          } | tee -a "$GITHUB_STEP_SUMMARY"

          echo ""
          echo "Reminder: these won't match exactly -- production has kept changing since last night's 02:00 UTC dump. Look for 'in the right ballpark, no table at or near zero' rather than an exact match. A restored count of 0 on a table that's clearly non-zero in production is the actual failure signal here."

          {
            echo ""
            echo "**Row count comparison:**"
            echo '```'
            echo "-- production --"; cat /tmp/prod_counts.txt
            echo "-- restored copy --"; cat /tmp/restored_counts.txt
            echo '```'
          } >> /tmp/drill_report.md

      # GitHub's raw job logs live on blob storage that isn't reachable from every environment
      # (confirmed while building this workflow), so a failure captured only in step output isn't
      # actually retrievable everywhere the drill result might need to be read from. Posting the
      # restore output and row-count comparison as a commit comment instead means it's reachable
      # through the plain REST API (repos/.../commits/.../comments) from anywhere, pass or fail.
      - name: Post drill result as a commit comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Restore drill result: ${{ job.status }}"
            echo ""
            if [ -f /tmp/drill_report.md ]; then cat /tmp/drill_report.md; else echo "(no report captured -- failed before the restore step ran; check which earlier step failed)"; fi
          } > /tmp/comment_body.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -f body="$(cat /tmp/comment_body.md)"
