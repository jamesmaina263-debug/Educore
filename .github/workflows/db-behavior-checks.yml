name: DB behavior checks

# Runs every rollback-only SQL behavior test in supabase/tests/ against the production database,
# one at a time, AFTER migrations are deployed. Replaces one workflow per feature.
#
# Why post-deploy: these tests exercise the deployed database. Run on a PR (or in parallel with
# "Deploy migrations") they fail whenever a PR ships a migration together with its test, because
# the migration is not applied yet. workflow_run makes the ordering real instead of assumed.
#
# Triggers
#   workflow_run  - after "Deploy migrations" succeeds on main. Deploy migrations runs on every
#                   push to main, so this covers every commit, including test-only changes.
#   schedule      - nightly, so drift in production data (a flag turned on for a real school, live
#                   tracker rows) is caught when it happens, not on the next migration push
#   dispatch      - manual
#
# Safety: a file with no `rollback;` is refused, so a future test can never commit to production.
# Tests listed in .github/db-checks-advisory.txt report warnings instead of failing the run.

on:
  workflow_run:
    workflows: ["Deploy migrations"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

# One suite at a time against production. A newer pending run replaces an older pending one,
# which is fine: every run tests the whole suite against current production.
concurrency:
  group: db-behavior-checks
  cancel-in-progress: false

permissions:
  contents: read
  actions: read   # to see whether the nightly backup is running

jobs:
  run:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Check SUPABASE_DB_URL is set
        run: |
          if [ -z "${{ secrets.SUPABASE_DB_URL }}" ]; then
            echo "SUPABASE_DB_URL repo secret is not set. Failing loudly instead of skipping silently."
            exit 1
          fi

      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # The nightly backup's pg_dump holds a shared lock on every table for ~2 minutes. A test that
      # needs an exclusive lock (audit_hardening.sql truncates audit_log) would queue behind it until
      # statement_timeout. Seen on production 2026-11-05 09:13, when the suite started 5 seconds
      # before the dump. Wait for a running backup instead of colliding with it.
      - name: Wait for a running nightly backup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 24); do
            n=$(gh api "repos/${{ github.repository }}/actions/workflows/nightly-backup.yml/runs?status=in_progress" --jq '.total_count' 2>/dev/null || echo 0)
            if [ "$n" = "0" ]; then echo "no backup running"; exit 0; fi
            echo "nightly backup is running, waiting 30s ($i/24)"
            sleep 30
          done
          echo "::warning::the nightly backup was still running after 12 minutes; continuing anyway"

      - name: Run behavior tests sequentially
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUITE_LABEL: DB behavior checks (production)
        run: scripts/run-db-tests.sh
