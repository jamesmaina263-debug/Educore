name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Dependency audit
        # Fails the build on high/critical vulnerabilities in PRODUCTION dependencies
        # (--omit=dev), i.e. anything that ships in or runs inside the app. Moderate/low
        # findings don't block CI -- Dependabot's weekly PRs are the mechanism for those,
        # since gating every PR on every moderate finding would make CI red for reasons
        # unrelated to the change being reviewed.
        #
        # Dev-only tooling (eslint, eslint-config-next, ...) is excluded on purpose: it never
        # reaches production, and some advisories there have no patched release (e.g. `braces`
        # via eslint-config-next, GHSA-vfj7-8cjw-p6xm, 2026-10), which would otherwise leave
        # CI red for every PR with nothing actionable to do. Run a plain `npm audit` locally
        # to see dev-tooling findings. Re-evaluate if that trade-off stops making sense.
        run: npm audit --omit=dev --audit-level=high

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
