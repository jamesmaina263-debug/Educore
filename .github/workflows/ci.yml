name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Dependency audit (production dependencies)
        # Fails the build on high/critical vulnerabilities in packages that
        # ship to / run in production (--omit=dev). Moderate/low findings are
        # surfaced (npm audit still prints them) but don't block CI --
        # Dependabot's weekly PRs are the mechanism for those, since gating
        # every PR on every moderate finding would make CI red for reasons
        # unrelated to the change being reviewed. Re-evaluate this threshold
        # if that trade-off stops making sense.
        #
        # Dev tooling is audited separately below and does not block: a new
        # advisory in lint/test tooling with no non-breaking fix (e.g. braces
        # via eslint-config-next, 2026-10) would otherwise turn every PR red,
        # including security fixes, without any production exposure.
        run: npm audit --omit=dev --audit-level=high

      - name: Dependency audit (dev tooling, informational)
        # Same threshold, dev dependencies included. Never fails the job, but
        # the findings stay visible in the log on every run.
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
