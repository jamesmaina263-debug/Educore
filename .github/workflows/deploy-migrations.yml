name: Deploy migrations

# Closes a real gap found 2026-08-27: migrations were only ever applied to
# production by someone remembering to run `supabase db push` by hand after
# merging. At least one migration (20260826120000_admission_response_time_note)
# merged to main and was simply never run -- silently broke the public apply
# form for every school until it was caught and applied manually. CI (ci.yml)
# only builds/tests the app; it has never touched the database schema.
#
# This workflow makes "merged to main" and "applied to the database" the same
# event, the same way Vercel already makes "merged to main" and "deployed"
# the same event for the app itself.
#
# SUPABASE_DB_URL must be the Session pooler connection string
# (postgresql://postgres.<ref>:<password>@aws-X-<region>.pooler.supabase.com:5432/postgres),
# not the direct db.<ref>.supabase.co host -- the direct host resolves IPv6-only
# and GitHub-hosted runners have no outbound IPv6 route, so it fails instantly.
# (Updated 2026-08-28 after the workflow failed on every run since creation.)
#
# --include-all: two migration files (20260822000000, 20260826100000) carry
# timestamps earlier than migrations already applied after them, a side
# effect of the drift reconciliation in #87. Without this flag `db push`
# refuses to insert anything "out of order". Both are confirmed idempotent
# with their effects already live in production (see #87), so applying them
# here is a formality that just records them correctly -- not a real change.
#
# `supabase db push` is idempotent by design: it only runs migrations whose
# version isn't already recorded in supabase_migrations.schema_migrations,
# and it fails loudly (non-zero exit -> red X on the run) rather than
# swallowing an error, so a bad migration blocks visibly instead of silently
# not-happening the way this one did.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only -- show what would run without applying it"
        type: boolean
        default: false

jobs:
  push-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          # Pinned per Supabase's own supply-chain guidance -- see deploy-functions.yml for
          # the full rationale (this workflow had the identical unpinned-CLI-version issue).
          # Bump deliberately, as a reviewed diff, not silently.
          version: "2.116.0"

      - name: Push migrations
        run: |
          set +e
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "Dry run -- previewing pending migrations, nothing will be applied:"
            OUTPUT=$(supabase db push --db-url "${{ secrets.SUPABASE_DB_URL }}" --include-all --dry-run 2>&1)
          else
            OUTPUT=$(supabase db push --db-url "${{ secrets.SUPABASE_DB_URL }}" --include-all 2>&1)
          fi
          STATUS=$?
          echo "$OUTPUT"
          if [ $STATUS -ne 0 ]; then
            SAFE=$(echo "$OUTPUT" | sed -E 's#(postgres(ql)?://[^:]+):[^@]*@#\1:REDACTED@#g' | tr '\n' ' ' | tail -c 900)
            echo "::error::db push failed: $SAFE"
            exit 1
          fi

      # This exact failure mode (a merged migration silently never reaching prod) has already
      # caused one real ~75-minute outage (see deploy-functions.yml's 2026-09-02 note) and was
      # observed again on 2026-09-04/05 with no one aware until a manual check -- "merged" was
      # never a safe proxy for "applied" without this. Same fail-safe, no-op-if-unset posture
      # as sendSecurityAlert()/migration-drift-check.yml: never fails the job, never blocks on
      # a slow/broken webhook.
      - name: Notify Slack on failure
        if: failure()
        env:
          WEBHOOK_URL: ${{ secrets.SECURITY_ALERT_WEBHOOK_URL }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "SECURITY_ALERT_WEBHOOK_URL not set -- skipping Slack notification."
            exit 0
          fi
          python3 -c "import json, os; text = ':rotating_light: *Deploy migrations failed* -- a merged migration may not be live on production.\n• *run*: ' + os.environ['RUN_URL']; json.dump({'text': text}, open('/tmp/slack_payload.json', 'w'))"
          curl -s -X POST -H "Content-Type: application/json" -d @/tmp/slack_payload.json "$WEBHOOK_URL" > /dev/null || true
