name: Nightly database backup

on:
  schedule:
    # 02:00 UTC daily. Interim stopgap only -- see RPO_RTO_POLICY.md.
    - cron: "0 2 * * *"
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Check SUPABASE_DB_URL is set
        run: |
          if [ -z "${{ secrets.SUPABASE_DB_URL }}" ]; then
            echo "SUPABASE_DB_URL repo secret is not set -- see RPO_RTO_POLICY.md section 3. Failing loudly instead of skipping silently."
            exit 1
          fi

      # Pinned to match the Supabase project's server version (17.x, confirmed
      # via `Supabase:get_project` -- postgres_engine: "17") rather than
      # whatever `postgresql-client` Ubuntu's default repo happens to carry.
      # pg_dump refuses (hard failure, not a warning) to dump from a server
      # newer than itself -- ubuntu-latest is Ubuntu 24.04 (noble), whose
      # default apt repo carries client v16, one major version behind. That
      # mismatch is the confirmed root cause of the last two nights' runs
      # both failing at exactly this step with "Process completed with exit
      # code 1." Installs from PostgreSQL's own apt repo (apt.postgresql.org)
      # instead, which carries every still-supported major version explicitly
      # versioned as its own package (postgresql-client-17), so this stays
      # correct even after Ubuntu's own default client version moves again.
      - name: Install postgresql-client-17
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release ca-certificates
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      # Diagnostic-only addition (temporary, until this run is confirmed
      # green): surfaces pg_dump's real stderr as a GitHub annotation.
      # GitHub's default failure annotation for a plain `run:` step is just
      # "Process completed with exit code 1" with no detail, and this
      # sandbox's network access can't reach the raw log storage host to
      # read the full output any other way.
      - name: Dump database
        run: |
          set +e
          # Explicit versioned path, not bare `pg_dump` -- confirmed via a
          # live diagnostic run that ubuntu-latest already ships a
          # PGDG-built v16 pg_dump that stays first on PATH even after
          # installing postgresql-client-17 alongside it, so PATH
          # resolution alone doesn't guarantee which version actually
          # runs. This sidesteps that entirely.
          /usr/lib/postgresql/17/bin/pg_dump "${{ secrets.SUPABASE_DB_URL }}" \
            --no-owner --no-privileges --format=custom \
            --file=educore-backup-$(date +%Y-%m-%d).dump 2>pg_dump_stderr.log
          status=$?
          if [ $status -ne 0 ]; then
            echo "::error::pg_dump exited $status: $(tr '\n' ' ' < pg_dump_stderr.log | head -c 1500)"
            exit $status
          fi

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: educore-backup-${{ github.run_id }}
          path: educore-backup-*.dump
          retention-days: 90
