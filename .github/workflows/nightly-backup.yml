name: Nightly database backup

on:
  schedule:
    # 02:00 UTC daily. Interim stopgap only -- see RPO_RTO_POLICY.md.
    - cron: "0 2 * * *"
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Check SUPABASE_DB_URL is set
        run: |
          if [ -z "${{ secrets.SUPABASE_DB_URL }}" ]; then
            echo "SUPABASE_DB_URL repo secret is not set -- see RPO_RTO_POLICY.md section 3. Failing loudly instead of skipping silently."
            exit 1
          fi

      # Pinned to match the Supabase project's server version (17.x, confirmed
      # via `Supabase:get_project` -- postgres_engine: "17") rather than
      # whatever `postgresql-client` Ubuntu's default repo happens to carry.
      # pg_dump refuses (hard failure, not a warning) to dump from a server
      # newer than itself -- ubuntu-latest is Ubuntu 24.04 (noble), whose
      # default apt repo carries client v16, one major version behind. That
      # mismatch is the confirmed root cause of the last two nights' runs
      # both failing at exactly this step with "Process completed with exit
      # code 1." Installs from PostgreSQL's own apt repo (apt.postgresql.org)
      # instead, which carries every still-supported major version explicitly
      # versioned as its own package (postgresql-client-17), so this stays
      # correct even after Ubuntu's own default client version moves again.
      - name: Install postgresql-client-17
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release ca-certificates
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Dump database
        run: |
          # Explicit versioned path, not bare `pg_dump` -- ubuntu-latest
          # already ships a PGDG-built v16 pg_dump that stays first on
          # PATH even after installing postgresql-client-17 alongside it
          # (confirmed via a live diagnostic run), so PATH resolution
          # alone doesn't guarantee which version actually runs. Calling
          # the versioned binary directly sidesteps that.
          /usr/lib/postgresql/17/bin/pg_dump "${{ secrets.SUPABASE_DB_URL }}" \
            --no-owner --no-privileges --format=custom \
            --file=educore-backup-$(date +%Y-%m-%d).dump

      - name: Verify dump integrity
        run: |
          # A pg_dump that silently produces a truncated or empty file still exits 0 and
          # still uploads successfully -- the failure mode this is meant to catch is "we
          # uploaded 90 days of unusable dumps and only found out during a real incident."
          # pg_restore --list parses the dump's table of contents without needing a live
          # database, so this runs safely in CI: it fails loudly (not silently) if the file
          # doesn't parse as a valid custom-format dump, and again if a representative set of
          # core tables -- spanning student data, finance, and auth/RLS-adjacent config, so a
          # partial dump missing a whole subsystem gets caught too -- isn't present in it.
          DUMP_FILE=$(ls educore-backup-*.dump)
          FILE_SIZE=$(stat -c%s "$DUMP_FILE")
          echo "Dump file: $DUMP_FILE ($FILE_SIZE bytes)"

          if [ "$FILE_SIZE" -lt 10240 ]; then
            echo "Dump is suspiciously small (<10KB) for a school-management database with real data. Treating as a failed backup."
            exit 1
          fi

          TOC=$(/usr/lib/postgresql/17/bin/pg_restore --list "$DUMP_FILE")
          if [ -z "$TOC" ]; then
            echo "pg_restore could not parse a table of contents from the dump -- file is corrupt or incomplete."
            exit 1
          fi

          MISSING=""
          for TABLE in students invoices payments school_users academic_years; do
            if ! echo "$TOC" | grep -q "TABLE DATA public $TABLE "; then
              MISSING="$MISSING $TABLE"
            fi
          done

          if [ -n "$MISSING" ]; then
            echo "Dump is missing expected core tables:$MISSING -- this is not a complete backup."
            exit 1
          fi

          echo "Dump verified: parses correctly and contains data for all expected core tables."

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: educore-backup-${{ github.run_id }}
          path: educore-backup-*.dump
          retention-days: 90
