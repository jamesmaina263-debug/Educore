name: Refresh OSM schools dataset

# Builds src/data/osm-schools-ke.json (named schools + kindergartens per Kenyan county, from the Geofabrik
# Kenya OpenStreetMap extract) and uploads it as a build artifact. Manual only: download the artifact,
# commit it on a branch and open a normal PR so CI and review apply. Nothing here touches production.
# Suggested cadence: every few months, or before a big outreach push.

on:
  workflow_dispatch:
  push: # TEMP-TEST: remove before PR
    branches: [feat/outreach-local-osm-dataset]
    paths: [scripts/build_osm_schools.py, .github/workflows/refresh-osm-schools.yml]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool
          pip install shapely

      - name: Download Kenya extract
        run: curl -fsSL --retry 5 --retry-delay 10 -o kenya-latest.osm.pbf https://download.geofabrik.de/africa/kenya-latest.osm.pbf

      - name: Build dataset
        run: python3 scripts/build_osm_schools.py kenya-latest.osm.pbf src/data/osm-schools-ke.json

      - uses: actions/upload-artifact@v4
        with:
          name: osm-schools-ke
          path: src/data/osm-schools-ke.json
          retention-days: 30
