name: Vehicle positions behavior check

# Runs supabase/tests/vehicle_positions.sql -- a rollback-only behavioral test (synthetic fixtures,
# real role impersonation via request.jwt.claims, the real deployed functions and policies) for
# WP 5.1: feature flag gating, device creation/revocation, hash-only token storage, service-role-only
# ingestion, validation/dedupe, role + tenant isolation on reads, and the retention purge.
# Same pattern, secret and safety model as fee-reminders-behavior-check.yml (begin ... rollback plus
# a leak tripwire). It tests the deployed database, so it runs on push to main (after Deploy
# migrations), not on PRs where the migration is not applied yet.

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/vehicle_positions.sql"
      - ".github/workflows/vehicle-positions-behavior-check.yml"
  workflow_dispatch: {}

jobs:
  vehicle-positions-behavior-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Check SUPABASE_DB_URL is set
        run: |
          if [ -z "${{ secrets.SUPABASE_DB_URL }}" ]; then
            echo "SUPABASE_DB_URL repo secret is not set. Failing loudly instead of skipping silently."
            exit 1
          fi

      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run vehicle positions behavioral test
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set +e
          out=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/vehicle_positions.sql 2>&1)
          code=$?
          echo "$out"
          if [ "$code" -ne 0 ]; then
            echo "$out" | grep -E "ERROR|CONTEXT|DETAIL|HINT|LEAK" | head -10 | while IFS= read -r line; do echo "::error::${line}"; done
            exit "$code"
          fi
