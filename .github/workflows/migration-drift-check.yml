name: Migration drift check

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/.migration_drift_allowlist"
      - "scripts/check_migration_drift.py"
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/.migration_drift_allowlist"
      - "scripts/check_migration_drift.py"
  schedule:
    # Was daily -- written when direct-to-prod drift was assumed rare. 2026-09-02
    # saw 3 instances in about an hour (concurrent sessions applying migrations
    # straight to Supabase), each silently blocking deploy-functions.yml's
    # schema-sync guard until someone noticed. 15 minutes bounds the exposure
    # window to roughly that instead of up to 24 hours.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  check-drift:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Check SUPABASE_DB_URL is set
        run: |
          if [ -z "${{ secrets.SUPABASE_DB_URL }}" ]; then
            echo "SUPABASE_DB_URL repo secret is not set -- same secret nightly-backup.yml uses. Failing loudly instead of skipping silently."
            exit 1
          fi

      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Fetch production's applied migration history
        id: prod
        run: |
          RESULT=$(psql "${{ secrets.SUPABASE_DB_URL }}" -Atqc \
            "select coalesce(json_agg(json_build_object('version', version, 'name', name)), '[]') from supabase_migrations.schema_migrations;")
          {
            echo "json<<MIGRATIONS_EOF"
            echo "$RESULT"
            echo "MIGRATIONS_EOF"
          } >> "$GITHUB_ENV"

      - name: Compare against supabase/migrations/
        id: compare
        env:
          PROD_MIGRATIONS_JSON: ${{ env.json }}
        run: |
          set +e
          python3 scripts/check_migration_drift.py > /tmp/drift_output.txt 2>&1
          code=$?
          cat /tmp/drift_output.txt
          exit $code

      # The raw Actions log for a failed run isn't easy to get at outside the GitHub UI
      # (no stable API for it). Posting the script's own stdout as a PR comment when it
      # fails means the exact missing-version detail is visible right where the check
      # ran, not just a pass/fail dot -- doesn't change what the check itself decides.
      - name: Fetch recorded statements for any missing versions
        if: failure() && steps.compare.outcome == 'failure'
        run: |
          # Matches check_migration_drift.py's exact `f"  {v}  ({name})"` line format for
          # the "missing from repo" case. Won't match the collision-failure case's different
          # format (`f"  {v}:"` + nested `- {name}` lines), so this only fires for the case
          # where fetching statements actually makes sense.
          VERSIONS=$(grep -oP '^  \K[0-9]{8,14}(?=  \()' /tmp/drift_output.txt | sort -u)
          > /tmp/missing_statements.md
          if [ -z "$VERSIONS" ]; then
            echo "(No individually-missing versions parsed from the output -- likely a collision failure instead. See the drift output above for detail.)" > /tmp/missing_statements.md
          else
            echo "### Recorded statements for the missing version(s)" >> /tmp/missing_statements.md
            echo "" >> /tmp/missing_statements.md
            echo "Reconstruct any reconciliation migration from these verbatim -- not from live schema introspection (see the drift output above for why)." >> /tmp/missing_statements.md
            for V in $VERSIONS; do
              NAME=$(psql "${{ secrets.SUPABASE_DB_URL }}" -Atqc \
                "select coalesce(name, '(no name recorded)') from supabase_migrations.schema_migrations where version = '$V';")
              STMT=$(psql "${{ secrets.SUPABASE_DB_URL }}" -Atqc \
                "select coalesce(array_to_string(statements, E'\n---STATEMENT---\n'), '(no statements recorded)') from supabase_migrations.schema_migrations where version = '$V';")
              {
                echo ""
                echo "#### ${V} (${NAME})"
                echo '```sql'
                echo "$STMT"
                echo '```'
              } >> /tmp/missing_statements.md
            done
          fi

      # Same webhook and safe-by-default posture as sendSecurityAlert() in
      # src/lib/security-alert.ts: no-op if SECURITY_ALERT_WEBHOOK_URL isn't configured,
      # never fails the job on a Slack-side error. This is the piece that actually closes
      # the loop -- a red check or an open PR sitting unnoticed is exactly how the last
      # few drift gaps went unaddressed for multiple pushes in a row.
      - name: Notify Slack on failure
        if: failure()
        env:
          WEBHOOK_URL: ${{ secrets.SECURITY_ALERT_WEBHOOK_URL }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "SECURITY_ALERT_WEBHOOK_URL not set -- skipping Slack notification (same no-op-by-default posture as src/lib/security-alert.ts)."
            exit 0
          fi
          MISSING_COUNT=$(grep -oP '^  \K[0-9]{8,14}(?=  \()' /tmp/drift_output.txt | sort -u | wc -l | tr -d ' ')
          python3 -c "import json, os, sys; text = ':rotating_light: *Migration drift check failed*\n\u2022 *ref*: ' + os.environ['REF_NAME'] + '\n\u2022 *missing versions*: ' + (sys.argv[1] or 'see log') + '\n\u2022 *run*: ' + os.environ['RUN_URL']; json.dump({'text': text}, open('/tmp/slack_payload.json', 'w'))" "$MISSING_COUNT"
          curl -s -X POST -H "Content-Type: application/json" -d @/tmp/slack_payload.json "$WEBHOOK_URL" > /dev/null || true

      # Looks up an open PR for the current ref rather than trusting github.event.pull_request
      # directly, so this also works when the run comes from workflow_dispatch or a push to a
      # branch with an open PR, not just a genuine pull_request-triggered run.
      - name: Post drift summary as PR comment on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Migration drift check failed"
            echo '```'
            cat /tmp/drift_output.txt
            echo '```'
            echo ""
            cat /tmp/missing_statements.md 2>/dev/null || true
          } > /tmp/drift_comment.md
          PR_NUMBER=$(gh pr list --repo "${{ github.repository }}" --head "${{ github.ref_name }}" --state open --json number --jq '.[0].number // empty')
          if [ -n "$PR_NUMBER" ]; then
            gh pr comment "$PR_NUMBER" --body-file /tmp/drift_comment.md --repo "${{ github.repository }}"
          else
            echo "No open PR found for ref ${{ github.ref_name }} -- skipping comment post (output is above in the job log)."
          fi

  # Only on schedule/workflow_dispatch -- a push/PR run is validating a specific proposed
  # change, not reporting independently-discovered prod drift, so auto-opening a
  # reconciliation PR there would be surprising. Uses the default GITHUB_TOKEN (no new
  # secret) to write the missing files and open the PR -- see reconcile_migration_drift.py
  # for how content is sourced (verbatim from schema_migrations, never introspected/guessed).
  #
  # KNOWN LIMITATION, not fixed here: GitHub doesn't trigger further workflow runs (including
  # ci.yml's required check) from a push/PR made with GITHUB_TOKEN -- this prevents recursive
  # workflow runs, but also means this job's own PR can't satisfy branch protection on its
  # own. `gh pr merge --auto` is still called so it's pre-armed: the moment a human or an
  # agent with a real PAT pushes so much as an empty commit to the branch (or re-approves),
  # ci runs and the PR merges itself immediately, without anyone needing to remember to
  # enable auto-merge. Closing this gap for real needs a PAT stored as a repo secret --
  # deliberately not done here without explicit sign-off, since persisting a powerful
  # long-lived credential as a CI secret is a security decision, not a code change.
  auto-reconcile-drift:
    needs: check-drift
    if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Check SUPABASE_DB_URL is set
        run: |
          if [ -z "${{ secrets.SUPABASE_DB_URL }}" ]; then
            echo "SUPABASE_DB_URL repo secret is not set -- failing loudly instead of skipping silently."
            exit 1
          fi

      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Fetch production's migration history with statements
        run: |
          RESULT=$(psql "${{ secrets.SUPABASE_DB_URL }}" -Atqc \
            "select coalesce(json_agg(json_build_object('version', version, 'name', name, 'statements', statements)), '[]') from supabase_migrations.schema_migrations;")
          {
            echo "json<<MIGRATIONS_EOF"
            echo "$RESULT"
            echo "MIGRATIONS_EOF"
          } >> "$GITHUB_ENV"

      - name: Write any reconcilable migration files
        id: reconcile
        env:
          PROD_MIGRATIONS_JSON: ${{ env.json }}
        run: |
          set +e
          python3 scripts/reconcile_migration_drift.py
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Check whether anything was written
        id: changes
        run: |
          if git status --porcelain -- supabase/migrations/ | grep -q .; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the reconciliation PR
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="auto/migration-drift-reconcile"
          git checkout -B "$BRANCH"
          git add supabase/migrations/
          printf '%s\n' \
            "chore: auto-reconcile migration drift" \
            "" \
            "Generated by scripts/reconcile_migration_drift.py after this workflow's" \
            "scheduled run found production migrations with no matching git file." \
            "Each file's content is verbatim from supabase_migrations.schema_migrations" \
            "-- see that script for how/why, and the job log for anything that" \
            "couldn't be reconciled automatically." \
            > /tmp/commit_msg.txt
          git commit -F /tmp/commit_msg.txt
          git push origin "$BRANCH" --force
          EXISTING_PR=$(gh pr list --repo "${{ github.repository }}" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$EXISTING_PR" ]; then
            printf '%s\n' \
              "Opened automatically after a scheduled migration-drift-check run found production migration(s) with no matching git file. Content pulled verbatim from supabase_migrations.schema_migrations -- nothing guessed or introspected." \
              "" \
              "**This PR needs a human or an agent with a real PAT to push a commit (even an empty one) or otherwise nudge it before it can merge** -- GitHub doesn't run the required \`ci\` check on a PR opened with the workflow's own token, so auto-merge is armed but won't fire on its own. See migration-drift-check.yml's auto-reconcile-drift job for why." \
              "" \
              "If the job log shows any version it couldn't reconcile automatically (no name/statements recorded in schema_migrations), that one still needs manual investigation -- see supabase/.migration_drift_allowlist's header for the pattern." \
              > /tmp/pr_body.md
            gh pr create --repo "${{ github.repository }}" --base main --head "$BRANCH" \
              --title "chore: auto-reconcile migration drift" \
              --body-file /tmp/pr_body.md
            PR_NUMBER=$(gh pr list --repo "${{ github.repository }}" --head "$BRANCH" --state open --json number --jq '.[0].number')
          else
            PR_NUMBER="$EXISTING_PR"
            gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body "Updated with additional drift found since this PR was opened (still needs a real push to trigger \`ci\` -- see PR description)."
          fi
          gh pr merge "$PR_NUMBER" --repo "${{ github.repository }}" --auto --squash \
            || echo "Could not enable auto-merge (may already be enabled) -- PR is still open."
