name: Web push subscriptions behavior check

# Runs supabase/tests/web_push_subscriptions.sql: a behavioral test (synthetic fixtures, real role
# impersonation via the request.jwt.claims GUC, the real deployed functions, policies and column grants)
# for web push subscriptions (WP 8.3): flag gating, own-device visibility, subscription keys unreadable
# by browser roles, no direct writes, cross-person and cross-school isolation, the endpoint move, revoke,
# dead endpoints, the 500-recipient cap, and the service_role-only sender functions. Same pattern, same
# secret and same safety model as staff-training-records-check.yml: the script opens with `begin;`, ends
# with `rollback;`, and a final tripwire fails loudly if any fixture row persisted. No nightly schedule.

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/web_push_subscriptions.sql"
      - ".github/workflows/web-push-subscriptions-check.yml"
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/web_push_subscriptions.sql"
      - ".github/workflows/web-push-subscriptions-check.yml"
  workflow_dispatch: {}

jobs:
  web-push-subscriptions-check:
    # Same Dependabot carve-out as scheme-of-work-rls-check.yml: GitHub withholds secrets from
    # dependabot[bot] runs, and the production DB credential is deliberately not exposed to them.
    if: ${{ !(github.event_name == 'pull_request' && github.actor == 'dependabot[bot]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Check SUPABASE_DB_URL is set
        run: |
          if [ -z "${{ secrets.SUPABASE_DB_URL }}" ]; then
            echo "SUPABASE_DB_URL repo secret is not set -- same secret scheme-of-work-rls-check.yml uses. Failing loudly instead of skipping silently."
            exit 1
          fi

      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run web push subscriptions behavioral test
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set +e
          out=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/web_push_subscriptions.sql 2>&1)
          code=$?
          echo "$out"
          if [ "$code" -ne 0 ]; then
            # Surface the failing assertion as annotations so it is visible without opening the raw log.
            echo "$out" | grep -E "ERROR|CONTEXT|DETAIL|HINT|LEAK" | head -10 | while IFS= read -r line; do echo "::error::${line}"; done
            exit "$code"
          fi
