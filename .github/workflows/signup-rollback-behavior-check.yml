name: Signup rollback behavior check

# Runs supabase/tests/signup_rollback.sql -- a behavioral test (synthetic fixtures, real role
# impersonation via the request.jwt.claims GUC, the real deployed functions and policies) for the
# rollback_unfinished_signup (R-new-17 follow-up): guards, real rollback flow, other schools untouched, audit_log still append-only.
# The script opens with `begin;`, ends with `rollback;`, and a final tripwire fails loudly if any fixture
# row persisted. Nothing it does is ever kept.
#
# Triggered by changes that could affect this behavior (any migration, the test file, this workflow)
# and on demand. Deliberately no nightly schedule: add one only if drift outside the migration flow
# becomes a concern for this feature.

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/signup_rollback.sql"
      - ".github/workflows/signup-rollback-behavior-check.yml"
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/signup_rollback.sql"
      - ".github/workflows/signup-rollback-behavior-check.yml"
  workflow_dispatch: {}

jobs:
  signup-rollback-behavior-check:
    # Same Dependabot carve-out as scheme-of-work-rls-check.yml: GitHub withholds secrets from
    # dependabot[bot] runs, and the production DB credential is deliberately not exposed to them.
    if: ${{ !(github.event_name == 'pull_request' && github.actor == 'dependabot[bot]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Check SUPABASE_DB_URL is set
        run: |
          if [ -z "${{ secrets.SUPABASE_DB_URL }}" ]; then
            echo "SUPABASE_DB_URL repo secret is not set -- same secret scheme-of-work-rls-check.yml uses. Failing loudly instead of skipping silently."
            exit 1
          fi

      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run signup rollback behavioral test
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set +e
          out=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/signup_rollback.sql 2>&1)
          code=$?
          echo "$out"
          if [ "$code" -ne 0 ]; then
            # Surface the failing assertion as annotations so it is visible without opening the raw log.
            echo "$out" | grep -E "ERROR|CONTEXT|DETAIL|HINT|LEAK" | head -10 | while IFS= read -r line; do echo "::error::${line}"; done
            exit "$code"
          fi
