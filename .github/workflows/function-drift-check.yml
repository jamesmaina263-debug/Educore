name: Edge function drift check

# Closes the gap the 2026-09-04 Zoho/Resend incident exposed: a session edited and
# deployed supabase/functions/_shared/email/index.ts straight to Supabase, bypassing
# deploy-functions.yml entirely, and nothing noticed until real school/parent emails
# started failing. There was no equivalent of migration-drift-check.yml for edge
# functions at all. Same pattern was already sitting unreconciled too:
# biometric-gate-webhook has been live in Supabase since 2026-08-28 with no matching
# repo directory (see config.toml's header comment) -- this check would have caught
# that the day it happened instead of it sitting flagged-but-inert for a week.
#
# See scripts/check_function_drift.py's module comment for exactly what's compared
# and why (entrypoint_path, not a content diff).

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/.function_drift_allowlist"
      - "scripts/check_function_drift.py"
  pull_request:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/.function_drift_allowlist"
      - "scripts/check_function_drift.py"
  schedule:
    # Same 15-minute cadence as migration-drift-check.yml, for the same reason --
    # bounding the exposure window for a direct-to-prod deploy that happens outside
    # any push/PR to this repo.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  check-drift:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Check SUPABASE_ACCESS_TOKEN is set
        run: |
          if [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ]; then
            echo "SUPABASE_ACCESS_TOKEN repo secret is not set -- same secret deploy-functions.yml uses. Failing loudly instead of skipping silently."
            exit 1
          fi

      - name: Fetch production's live edge functions
        id: functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          RESULT=$(curl -sf --request GET \
            "https://api.supabase.com/v1/projects/alzqlvfaftwegptfbfej/functions" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")
          if [ -z "$RESULT" ]; then
            echo "::error::Empty response from Supabase Management API -- failing loudly."
            exit 1
          fi
          {
            echo "json<<FUNCTIONS_EOF"
            echo "$RESULT"
            echo "FUNCTIONS_EOF"
          } >> "$GITHUB_ENV"

      - name: Compare against supabase/functions/
        id: compare
        env:
          SUPABASE_FUNCTIONS_JSON: ${{ env.json }}
        run: |
          set +e
          python3 scripts/check_function_drift.py > /tmp/drift_output.txt 2>&1
          code=$?
          cat /tmp/drift_output.txt
          exit $code

      # Same no-op-by-default posture as sendSecurityAlert() in src/lib/security-alert.ts
      # and migration-drift-check.yml's identical step -- a red check sitting unnoticed
      # is exactly how the Zoho incident and biometric-gate-webhook both went unaddressed.
      - name: Notify Slack on failure
        if: failure()
        env:
          WEBHOOK_URL: ${{ secrets.SECURITY_ALERT_WEBHOOK_URL }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "SECURITY_ALERT_WEBHOOK_URL not set -- skipping Slack notification."
            exit 0
          fi
          python3 -c "import json, os; text = ':rotating_light: *Edge function drift check failed*\n\u2022 *ref*: ' + os.environ['REF_NAME'] + '\n\u2022 *run*: ' + os.environ['RUN_URL']; json.dump({'text': text}, open('/tmp/slack_payload.json', 'w'))"
          curl -s -X POST -H "Content-Type: application/json" -d @/tmp/slack_payload.json "$WEBHOOK_URL" > /dev/null || true

      # Same "find the open PR for this ref" approach as migration-drift-check.yml,
      # so this also works on workflow_dispatch/schedule runs against a branch that
      # happens to have an open PR, not just genuine pull_request-triggered runs.
      - name: Post drift summary as PR comment on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Edge function drift check failed"
            echo '```'
            cat /tmp/drift_output.txt
            echo '```'
          } > /tmp/drift_comment.md
          PR_NUMBER=$(gh pr list --repo "${{ github.repository }}" --head "${{ github.ref_name }}" --state open --json number --jq '.[0].number // empty')
          if [ -n "$PR_NUMBER" ]; then
            gh pr comment "$PR_NUMBER" --body-file /tmp/drift_comment.md --repo "${{ github.repository }}"
          else
            echo "No open PR found for ref ${{ github.ref_name }} -- skipping comment post (output is above in the job log)."
          fi

  # NOTE, deliberately not built: migration-drift-check.yml has an auto-reconcile-drift
  # job that writes missing files automatically, because Postgres's schema_migrations
  # table stores each migration's exact SQL statements verbatim -- reconstructing a
  # missing file is just writing that text back out. There's no equivalent safe source
  # for edge functions: the Management API's function list doesn't return live source,
  # and pulling it via `supabase functions download` (untested against this repo,
  # not yet verified) or the dashboard risks silently committing something that was
  # deployed with different secrets/behavior than intended. Auto-reconciling code is a
  # different risk profile than auto-reconciling a recorded SQL statement. This check
  # deliberately only detects and alerts -- reconciling a flagged function (starting
  # with biometric-gate-webhook, already allowlisted above) needs a human or an agent
  # to pull the real source deliberately, review it, and commit it -- same as it would
  # without this check, just with the gap now visible instead of silent.
