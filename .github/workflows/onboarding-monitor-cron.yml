name: onboarding-monitor-cron

# School Onboarding & Engagement Monitor. Raises dashboard alerts for schools that need a person's help and, only if
# a super admin has approved the two templates and switched automation on, queues and sends the two automatic
# service emails (password reminder, login guidance). See src/app/api/cron/onboarding-monitor/route.ts.
#
# Reuses the EXTERNAL_CRON_SECRET repo secret + Vercel env var already used by trial-outbound-watch-cron.yml.
# Calls the "www" host directly (bare host 308-redirects).

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/onboarding-monitor
        run: |
          status=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.EXTERNAL_CRON_SECRET }}" \
            "https://www.educoreafrica.com/api/cron/onboarding-monitor")
          echo "HTTP status: $status"
          cat /tmp/response.json
          if [ "$status" -ge 300 ]; then
            echo "::error::onboarding-monitor cron call failed with status $status"
            exit 1
          fi

      - name: Notify Slack on failure
        if: failure()
        env:
          WEBHOOK_URL: ${{ secrets.SECURITY_ALERT_WEBHOOK_URL }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "SECURITY_ALERT_WEBHOOK_URL not set -- skipping Slack notification."
            exit 0
          fi
          python3 -c "import json, os; text = ':rotating_light: *Onboarding monitor cron call failed*.\n• *run*: ' + os.environ['RUN_URL']; json.dump({'text': text}, open('/tmp/slack_payload.json', 'w'))"
          curl -s -X POST -H "Content-Type: application/json" -d @/tmp/slack_payload.json "$WEBHOOK_URL" > /dev/null || true
