name: same-day-absence-cron

# WP 3.5 same-day absence alerts, DRY-RUN: evaluates what is due and records would_send rows. Sends nothing
# (see src/app/api/cron/same-day-absence/route.ts). With the feature flags off everywhere it does nothing.
# 05:00-13:59 UTC = 08:00-16:59 Nairobi, Monday to Friday: covers every cut-off (08:00-14:00) plus its 3-hour window.
# Reuses EXTERNAL_CRON_SECRET. Calls the "www" host directly (bare host 308-redirects).

on:
  schedule:
    - cron: "*/30 5-13 * * 1-5"
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/same-day-absence
        run: |
          status=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.EXTERNAL_CRON_SECRET }}" \
            "https://www.educoreafrica.com/api/cron/same-day-absence")
          echo "HTTP status: $status"
          cat /tmp/response.json
          if [ "$status" -ge 300 ]; then
            echo "::error::same-day-absence cron call failed with status $status"
            exit 1
          fi

      - name: Notify Slack on failure
        if: failure()
        env:
          WEBHOOK_URL: ${{ secrets.SECURITY_ALERT_WEBHOOK_URL }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "SECURITY_ALERT_WEBHOOK_URL not set -- skipping Slack notification."
            exit 0
          fi
          python3 -c "import json, os; text = ':rotating_light: *Same-day absence cron call failed*.\n• *run*: ' + os.environ['RUN_URL']; json.dump({'text': text}, open('/tmp/slack_payload.json', 'w'))"
          curl -s -X POST -H "Content-Type: application/json" -d @/tmp/slack_payload.json "$WEBHOOK_URL" > /dev/null || true
