name: Check M-Pesa code behavior check

# Runs supabase/tests/check_mpesa_code.sql, a behavioral test (synthetic fixtures, real role
# impersonation via the request.jwt.claims GUC, the real deployed function and policies) for the
# read-only "Check an M-Pesa code" lookup (Phase 1.2): callers with no session or without finance.read
# are refused, the code is matched case- and whitespace-insensitively, the three verdicts (recorded /
# seen_not_recorded / not_found) are correct, malformed input is refused, one school can never see
# another school's payments or statement lines, the C2B lookup stays off unless the flag is on, and
# anon cannot execute it. Same pattern, same secret and same safety model as
# scheme-of-work-rls-check.yml and fee-reminders-behavior-check.yml: the script opens with `begin;`,
# ends with `rollback;`, and a final tripwire fails loudly if any fixture row persisted.
#
# Triggered by changes that could affect this behavior (any migration, the test file, this workflow)
# and on demand. No nightly schedule.

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/check_mpesa_code.sql"
      - ".github/workflows/check-mpesa-code-behavior-check.yml"
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/check_mpesa_code.sql"
      - ".github/workflows/check-mpesa-code-behavior-check.yml"
  workflow_dispatch: {}

jobs:
  check-mpesa-code-behavior-check:
    # Same Dependabot carve-out as scheme-of-work-rls-check.yml: GitHub withholds secrets from
    # dependabot[bot] runs, and the production DB credential is deliberately not exposed to them.
    if: ${{ !(github.event_name == 'pull_request' && github.actor == 'dependabot[bot]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Check SUPABASE_DB_URL is set
        run: |
          if [ -z "${{ secrets.SUPABASE_DB_URL }}" ]; then
            echo "SUPABASE_DB_URL repo secret is not set -- same secret scheme-of-work-rls-check.yml uses. Failing loudly instead of skipping silently."
            exit 1
          fi

      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run check_mpesa_code behavioral test
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set +e
          out=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/check_mpesa_code.sql 2>&1)
          code=$?
          echo "$out"
          if [ "$code" -ne 0 ]; then
            # Surface the failing assertion as annotations so it is visible without opening the raw log.
            echo "$out" | grep -E "ERROR|CONTEXT|DETAIL|HINT|LEAK" | head -10 | while IFS= read -r line; do echo "::error::${line}"; done
            exit "$code"
          fi
