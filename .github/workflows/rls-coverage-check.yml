name: RLS tenant-coverage drift check

# 2026-09-14 production-readiness audit: the tenant-isolation pattern
# (auth_school_id() derived server-side, never trusted from the client) was
# verified correct against a sample of ~8 of roughly 120 tables -- consistent
# everywhere it was checked, but a sample isn't a guarantee. This checks
# every table in `public` that has a school_id column against production's
# actual pg_policies / relrowsecurity state, so a future table that adds a
# school_id column but forgets to wire up RLS (or wires up a policy that
# doesn't go through the shared auth_school_id()/auth_is_super_admin()
# helpers) gets caught within 15 minutes instead of shipping silently.
#
# Same cadence, secret, and posture as migration-drift-check.yml,
# function-drift-check.yml, and anon-execute-drift-check.yml -- see
# scripts/check_rls_coverage.py's module comment for the full query and
# reasoning, and supabase/.rls_coverage_allowlist for documented exceptions.

on:
  push:
    branches: [main]
    paths:
      - "supabase/.rls_coverage_allowlist"
      - "scripts/check_rls_coverage.py"
  pull_request:
    branches: [main]
    paths:
      - "supabase/.rls_coverage_allowlist"
      - "scripts/check_rls_coverage.py"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  check-drift:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Check SUPABASE_DB_URL is set
        run: |
          if [ -z "${{ secrets.SUPABASE_DB_URL }}" ]; then
            echo "SUPABASE_DB_URL repo secret is not set -- same secret the other drift checks use. Failing loudly instead of skipping silently."
            exit 1
          fi

      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Fetch production's school_id-bearing tables and their RLS coverage
        id: prod
        run: |
          RESULT=$(psql "${{ secrets.SUPABASE_DB_URL }}" -Atqc "
            select coalesce(json_agg(row_to_json(x)), '[]') from (
              select
                t.table_name as table,
                c.relrowsecurity as rls_enabled,
                coalesce(p.policy_count, 0) as policy_count,
                coalesce(p.has_tenant_ref, false) as references_tenant_helper
              from information_schema.tables t
              join pg_class c on c.relname = t.table_name
              join pg_namespace n on n.oid = c.relnamespace and n.nspname = t.table_schema
              left join (
                select tablename,
                       count(*) as policy_count,
                       bool_or(
                         coalesce(qual, '') ilike '%auth_school_id%'
                         or coalesce(with_check, '') ilike '%auth_school_id%'
                         or coalesce(qual, '') ilike '%auth_is_super_admin%'
                         or coalesce(with_check, '') ilike '%auth_is_super_admin%'
                       ) as has_tenant_ref
                from pg_policies
                where schemaname = 'public'
                group by tablename
              ) p on p.tablename = t.table_name
              where t.table_schema = 'public'
                and t.table_type = 'BASE TABLE'
                and exists (
                  select 1 from information_schema.columns col
                  where col.table_schema = 'public'
                    and col.table_name = t.table_name
                    and col.column_name = 'school_id'
                )
            ) x;
          ")
          {
            echo "json<<TABLES_EOF"
            echo "$RESULT"
            echo "TABLES_EOF"
          } >> "$GITHUB_ENV"

      - name: Compare against supabase/.rls_coverage_allowlist
        id: compare
        env:
          PROD_SCHOOL_TABLES_JSON: ${{ env.json }}
        run: |
          set +e
          python3 scripts/check_rls_coverage.py > /tmp/rls_drift_output.txt 2>&1
          code=$?
          cat /tmp/rls_drift_output.txt
          exit $code

      # Same no-op-by-default posture as the other three drift checks.
      - name: Notify Slack on failure
        if: failure()
        env:
          WEBHOOK_URL: ${{ secrets.SECURITY_ALERT_WEBHOOK_URL }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "SECURITY_ALERT_WEBHOOK_URL not set -- skipping Slack notification."
            exit 0
          fi
          python3 -c "import json, os; text = ':rotating_light: *RLS tenant-coverage drift check failed* -- a school_id-bearing table in public may not be tenant-isolated\n\u2022 *ref*: ' + os.environ['REF_NAME'] + '\n\u2022 *run*: ' + os.environ['RUN_URL']; json.dump({'text': text}, open('/tmp/slack_payload.json', 'w'))"
          curl -s -X POST -H "Content-Type: application/json" -d @/tmp/slack_payload.json "$WEBHOOK_URL" > /dev/null || true

      - name: Post drift summary as PR comment on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### RLS tenant-coverage drift check failed"
            echo "A table with a \`school_id\` column in \`public\` either has RLS disabled, or has policies that don't reference \`auth_school_id()\`/\`auth_is_super_admin()\`. This is the gap the 2026-09-14 production-readiness audit flagged as unverified beyond a sample of tables -- see that audit's report and \`scripts/check_rls_coverage.py\` for context."
            echo '```'
            cat /tmp/rls_drift_output.txt
            echo '```'
          } > /tmp/rls_drift_comment.md
          PR_NUMBER=$(gh pr list --repo "${{ github.repository }}" --head "${{ github.ref_name }}" --state open --json number --jq '.[0].number // empty')
          if [ -n "$PR_NUMBER" ]; then
            gh pr comment "$PR_NUMBER" --body-file /tmp/rls_drift_comment.md --repo "${{ github.repository }}"
          else
            echo "No open PR found for ref ${{ github.ref_name }} -- skipping comment post (output is above in the job log)."
          fi
