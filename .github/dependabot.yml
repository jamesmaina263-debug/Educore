version: 2
updates:
  # Cadence cut to monthly with at most 2 open PRs (5 Nov 2026): every dependabot PR is a Vercel preview build and
  # the team was running out of build credit. Security updates are not affected by this schedule.
  # npm dependencies. Grouped into one monthly PR for minor/patch bumps so
  # this doesn't spam individual PRs for every transitive package; major
  # version bumps still get their own PR since those are more likely to
  # need real review. Every PR still has to pass the normal `ci` check
  # (and, per AGENTS.md, can't merge to main without it going green) --
  # this only proposes updates, it never applies them on its own.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
    ignore:
      # v9 is a redesigned API (feature-based tables); bumping it breaks the
      # build in src/components/ui/data-table.tsx, which backs the staff,
      # students, parents and applications tables. Needs a deliberate
      # migration, not a drive-by bump. Remove this rule when that is planned.
      # Minor/patch updates on v8 still come through as normal.
      - dependency-name: "@tanstack/react-table"
        update-types: ["version-update:semver-major"]

  # GitHub Actions versions pinned in .github/workflows/*.yml (e.g.
  # actions/checkout@v4). Same monthly cadence, kept separate from the npm
  # ecosystem above per Dependabot's own convention.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
