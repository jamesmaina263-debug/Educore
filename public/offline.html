<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>You're offline — EduCore</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f8fafc;
      color: #1e293b;
    }
    .wrap {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .icon {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: #1e3a8a;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 24px;
      margin-bottom: 20px;
    }
    h1 { font-size: 1.25rem; margin: 0 0 8px; }
    p { color: #64748b; margin: 0 0 24px; max-width: 340px; line-height: 1.5; }
    button {
      background: #1e3a8a;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 0.9375rem;
      font-weight: 500;
      cursor: pointer;
    }
    button:active { opacity: 0.85; }
    .status { margin-top: 16px; font-size: 0.8125rem; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="icon">EC</div>
    <h1>No connection</h1>
    <p>EduCore couldn't reach the server. Check your internet connection and try again — nothing you were working on has been changed.</p>
    <button id="retry">Try again</button>
    <p class="status" id="status"></p>
  </div>
  <script>
    var btn = document.getElementById("retry");
    var status = document.getElementById("status");
    btn.addEventListener("click", function () {
      status.textContent = "Retrying…";
      window.location.reload();
    });
    // Auto-retry once the browser tells us connectivity is back.
    window.addEventListener("online", function () {
      status.textContent = "Connection restored — reloading…";
      window.location.reload();
    });
  </script>
</body>
</html>
